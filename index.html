
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>資源班數學教室 - 老師的 AI 教研助理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; }
        .math-text { line-height: 2.2; font-size: 1.5rem; font-weight: 700; }
        @media print { 
            .no-print { display: none !important; }
            .print-area { width: 100% !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; }
        }
    </style>
    <script>
      // Polyfill: 確保程式碼中存取 process.env 不會導致崩潰
      window.process = { env: { API_KEY: "" } };
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root">
        <div id="loader" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
            <div style="width: 40px; height: 40px; border: 4px solid #3b82f6; border-top-color: transparent; border-radius: 50%; animate: spin 1s linear infinite;"></div>
            <p style="margin-top: 20px; font-weight: bold; color: #64748b;">正在準備數學教室...</p>
        </div>
    </div>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="./index.tsx"></script>
    <script>
      window.onerror = function(msg, url, line) {
        console.error("啟動失敗: " + msg + " \n來源: " + url + ":" + line);
        if (msg.includes("unexpected token '<'")) {
            document.body.innerHTML = `<div style="padding: 40px; text-align: center; font-family: sans-serif;">
                <h1 style="color: #e11d48;">❌ 偵測到部署環境錯誤</h1>
                <p>瀏覽器無法直接執行 .tsx 檔案。</p>
                <p><b>解決方案：</b>請使用 <b>Vercel</b> 或 <b>Netlify</b> 進行部署，它們會自動幫您完成編譯。</p>
                <p style="color: #64748b; font-size: 14px;">(目前 GitHub Pages 需要額外設定 Build Action 才能執行 React)</p>
            </div>`;
        }
      };
    </script>
</body>
</html>
